#-------------------------------
# Watchdog (Sri Lanka): port of watchdog.team to Jekyll
#-------------------------------
title: Watchdog, Sri Lanka
description: Watchdog is an open-source research collective in Sri Lanka. Journalism, data science and technology in English, Sinhala and Tamil.
lang: en

# The site is served from a project page for now. When it moves to a
# custom domain, set baseurl to "" and url to the domain.
url: "https://team-watchdog.github.io"
baseurl: "/watchdog.github.io"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
timezone: Asia/Colombo

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

collections:
  articles:
    output: true
  contributors:
    output: true
  pages:
    output: true

defaults:
  - scope: { path: "", type: "articles" }
    values: { layout: "article" }
  - scope: { path: "", type: "contributors" }
    values: { layout: "contributor" }
  - scope: { path: "", type: "pages" }
    values: { layout: "page" }
  - scope: { path: "" }
    values: { layout: "default" }

# Obsolete files from the first half-done port and local-only folders.
exclude:
  - _posts
  - _authors
  - _sass
  - _plugins
  - authors
  - blog
  - videos
  - js/scripts.js
  - js/common.js
  - js/language-switcher.js
  - _includes/main.scss
  - watchdog-scrape
  - tests
  - scripts
  - node_modules
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .github
