tagline: Exposing Misinformation, Empowering Communities
intro: >-
  Watchdog is an open-source research collective in Sri Lanka. We bring
  journalism, data science and technology together. Since 2019 we have
  hunted misinformation, investigated matters of public welfare, and built
  software tools, either to help the country work better or to help you
  understand how it can.
